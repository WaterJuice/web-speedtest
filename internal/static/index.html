<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SERVER_NAME}}</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #232736;
    --border: #2a2e3d;
    --text: #e4e6ef;
    --text-dim: #6b7394;
    --accent: #6c8cff;
    --accent-glow: rgba(108, 140, 255, 0.15);
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }

  header p {
    color: var(--text-dim);
    font-size: 0.875rem;
  }

  header .version {
    font-size: 0.75rem;
    margin-top: 0.25rem;
    opacity: 0.5;
  }

  /* Beta ribbon */
  .beta-ribbon {
    position: fixed;
    top: 18px;
    left: -34px;
    z-index: 200;
    background: #f59e0b;
    color: var(--bg);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 40px;
    transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    opacity: 0.5;
  }

  .beta-ribbon.hidden {
    display: none;
  }

  /* Gauges */
  .gauges {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-bottom: 2rem;
  }

  .gauge {
    position: relative;
    width: 300px;
    height: 175px;
  }

  .gauge.hidden {
    visibility: hidden;
  }

  .gauge svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .gauge-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 12;
    stroke-linecap: round;
  }

  .gauge-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }

  .gauge-value {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .gauge-value .number {
    font-size: 2.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .gauge-value .unit {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .gauge-label {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Start button row (also holds copy buttons once results exist) */
  .start-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }

  .btn-start {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.75rem 3rem;
    border-radius: 9999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
  }

  .btn-start:hover:not(:disabled) {
    filter: brightness(1.15);
    box-shadow: 0 0 24px var(--accent-glow);
  }

  .btn-start:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Results panel */
  .results {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .result-row {
    display: flex;
    align-items: center;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
  }

  .result-row:last-child {
    border-bottom: none;
  }

  .result-row:hover {
    background: var(--surface-hover);
  }

  .result-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 1rem;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .result-icon.ping { background: rgba(108, 140, 255, 0.12); color: var(--accent); }
  .result-icon.download { background: rgba(74, 222, 128, 0.12); color: var(--green); }
  .result-icon.upload { background: rgba(251, 191, 36, 0.12); color: var(--yellow); }

  .result-label {
    flex: 1;
    font-size: 0.875rem;
    color: var(--text-dim);
  }

  .result-value {
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 120px;
    text-align: right;
  }

  .result-value.pending {
    color: var(--text-dim);
    font-weight: 400;
  }

  .result-value.active {
    color: var(--accent);
  }

  /* Status bar */
  .status {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    min-height: 1.2em;
  }

  /* Copy results buttons (appear beside the Test Again button) */
  .btn-copy {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.5rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.02em;
    display: none;
    /* Fixed width so "Copied!" / "Copy failed" don't reflow the row */
    min-width: 9.5rem;
    text-align: center;
  }

  .btn-copy.visible {
    display: inline-block;
  }

  .btn-copy:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--surface-hover);
  }

  .btn-copy.copied {
    color: var(--green);
    border-color: var(--green);
  }

  /* Spinner for active test */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
</style>
</head>
<body>

<div class="beta-ribbon" id="betaRibbon">Beta</div>

<div class="container">
  <header>
    <h1>{{SERVER_NAME}}</h1>
    <p>Measure your network performance</p>
    <p class="version">web-speedtest version: {{VERSION}}</p>
  </header>

  <div class="gauges" id="gauges">
    <div class="gauge hidden" id="gaugePing">
      <span class="gauge-label">PING</span>
      <svg viewBox="0 0 200 120">
        <path class="gauge-bg" d="M 20 110 A 80 80 0 0 1 180 110" />
        <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110"
              stroke-dasharray="251.33" stroke-dashoffset="251.33" />
      </svg>
      <div class="gauge-value">
        <div class="number">&mdash;</div>
        <div class="unit">&nbsp;</div>
      </div>
    </div>
    <div class="gauge hidden" id="gaugeDown">
      <span class="gauge-label">DOWNLOAD</span>
      <svg viewBox="0 0 200 120">
        <path class="gauge-bg" d="M 20 110 A 80 80 0 0 1 180 110" />
        <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110"
              stroke-dasharray="251.33" stroke-dashoffset="251.33" />
      </svg>
      <div class="gauge-value">
        <div class="number">&mdash;</div>
        <div class="unit">&nbsp;</div>
      </div>
    </div>
    <div class="gauge hidden" id="gaugeUp">
      <span class="gauge-label">UPLOAD</span>
      <svg viewBox="0 0 200 120">
        <path class="gauge-bg" d="M 20 110 A 80 80 0 0 1 180 110" />
        <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110"
              stroke-dasharray="251.33" stroke-dashoffset="251.33" />
      </svg>
      <div class="gauge-value">
        <div class="number">&mdash;</div>
        <div class="unit">&nbsp;</div>
      </div>
    </div>
  </div>

  <div class="start-wrap">
    <button class="btn-copy" id="btnCopyText" type="button" onclick="copyResultsText()">Copy as Text</button>
    <button class="btn-start" id="btnStart" onclick="startTest()">Start Test</button>
    <button class="btn-copy" id="btnCopyImage" type="button" onclick="copyResultsImage()">Copy as Image</button>
  </div>

  <div class="results">
    <div class="result-row">
      <div class="result-icon ping">&#8596;</div>
      <div class="result-label">Ping</div>
      <div class="result-value pending" id="resPing">&mdash;</div>
    </div>
    <div class="result-row">
      <div class="result-icon download">&#8595;</div>
      <div class="result-label">Download</div>
      <div class="result-value pending" id="resDownload">&mdash;</div>
    </div>
    <div class="result-row">
      <div class="result-icon upload">&#8593;</div>
      <div class="result-label">Upload</div>
      <div class="result-value pending" id="resUpload">&mdash;</div>
    </div>
  </div>

  <div class="status" id="status">&nbsp;</div>

</div>

<script>
(function() {
  'use strict';

  const PING_COUNT       = 10;
  const TEST_DURATION    = 8000;              // ms per test phase
  const WARMUP_MS        = 2000;              // discard first 2s of data (TCP slow-start)
  const PARALLEL_STREAMS = 6;
  const STREAM_CHUNK     = 100 * 1024 * 1024; // 100 MB per download request (loop until aborted)
  const UPLOAD_CHUNK     = 16 * 1024 * 1024;  // 16 MB per upload request (bytes tracked via XHR progress)
  const RESULT_UPDATE_MS = 500;               // throttle result panel text updates

  const ARC_LENGTH = 251.33;

  const btnStart    = document.getElementById('btnStart');
  const resPing     = document.getElementById('resPing');
  const resDown     = document.getElementById('resDownload');
  const resUp       = document.getElementById('resUpload');
  const statusEl    = document.getElementById('status');
  const btnCopyText = document.getElementById('btnCopyText');
  const btnCopyImg  = document.getElementById('btnCopyImage');
  const betaRibbon  = document.getElementById('betaRibbon');

  var lastResults = null;

  // Hide the beta ribbon on full release versions (strict X.Y.Z, no suffix).
  // Anything else — "1.0.0b10", "1.2.3.post.dev4", "dev", commit hash — keeps it.
  (function() {
    const versionText = (betaRibbon && document.querySelector('header .version').textContent) || '';
    const m = versionText.match(/version:\s*(\S+)/);
    if (m && /^\d+\.\d+\.\d+$/.test(m[1])) {
      betaRibbon.classList.add('hidden');
    }
  })();

  // Each gauge element and its sub-parts
  const gauges = ['gaugePing', 'gaugeDown', 'gaugeUp'].map(function(id) {
    const el = document.getElementById(id);
    return {
      el:     el,
      fill:   el.querySelector('.gauge-fill'),
      number: el.querySelector('.gauge-value .number'),
      unit:   el.querySelector('.gauge-value .unit')
    };
  });

  function setGauge(g, fraction, colour) {
    fraction = Math.max(0, Math.min(1, fraction));
    g.fill.style.strokeDashoffset = ARC_LENGTH * (1 - fraction);
    if (colour) g.fill.style.stroke = colour;
  }

  function showGauge(g) {
    g.el.classList.remove('hidden');
  }

  function resetAllGauges() {
    gauges.forEach(function(g) {
      g.el.classList.add('hidden');
      g.fill.style.strokeDashoffset = ARC_LENGTH;
      g.fill.style.stroke = 'var(--accent)';
      g.number.textContent = '\u2014';
      g.unit.textContent = '\u00a0';
    });
  }

  function formatSpeed(bps) {
    if (bps >= 1e9) return { value: (bps / 1e9).toFixed(2), unit: 'Gbps' };
    if (bps >= 1e6) return { value: (bps / 1e6).toFixed(2), unit: 'Mbps' };
    if (bps >= 1e3) return { value: (bps / 1e3).toFixed(1), unit: 'Kbps' };
    return { value: Math.round(bps), unit: 'bps' };
  }

  function formatLatency(ms) {
    if (ms < 10) return { value: ms.toFixed(2), unit: 'ms' };
    if (ms < 100) return { value: ms.toFixed(1), unit: 'ms' };
    return { value: Math.round(ms), unit: 'ms' };
  }

  // Gauge shows test progress (0 = start, 1 = done), not speed magnitude

  function computeMedian(arr) {
    var sorted = arr.slice().sort(function(a, b) { return a - b; });
    var mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }

  async function testPing() {
    const g = gauges[0];
    showGauge(g);
    statusEl.innerHTML = '<span class="spinner"></span> Testing ping\u2026';
    resPing.className = 'result-value active';
    resPing.innerHTML = '<span class="spinner"></span>';

    // Use WebSocket for low-overhead ping measurement
    var wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var wsUrl = wsProto + '//' + location.host + '/ws';

    return new Promise(function(resolve) {
      var latencies = [];
      var pingIndex = 0;
      var t0 = 0;
      var ws;
      var done = false;
      var safetyTimer;

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(safetyTimer);
        try { ws.close(); } catch (e) { /* ignore */ }
        if (latencies.length === 0) {
          resPing.textContent = 'failed';
          resPing.className = 'result-value';
          resolve(null);
          return;
        }
        var median = computeMedian(latencies);
        var fmt = formatLatency(median);
        resPing.textContent = fmt.value + ' ' + fmt.unit;
        resPing.className = 'result-value';
        resolve(median);
      }

      function fallbackToHTTP() {
        if (done) return;
        done = true;
        clearTimeout(safetyTimer);
        try { ws.close(); } catch (e) { /* ignore */ }
        resolve(testPingHTTP());
      }

      function sendNextPing() {
        if (pingIndex >= PING_COUNT) {
          finish();
          return;
        }
        t0 = performance.now();
        ws.send('ping');
      }

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        // WebSocket not available — fall back to HTTP ping
        done = true;
        resolve(testPingHTTP());
        return;
      }

      ws.onopen = function() {
        sendNextPing();
      };

      ws.onmessage = function(event) {
        if (done) return;
        if (event.data === 'pong') {
          var rtt = performance.now() - t0;
          latencies.push(rtt);
          pingIndex++;

          var median = computeMedian(latencies);
          var fmt = formatLatency(median);
          g.number.textContent = fmt.value;
          g.unit.textContent = fmt.unit;
          setGauge(g, pingIndex / PING_COUNT, 'var(--accent)');
          resPing.textContent = fmt.value + ' ' + fmt.unit;

          sendNextPing();
        }
      };

      ws.onerror = function() {
        // WebSocket failed — fall back to HTTP ping
        fallbackToHTTP();
      };

      // Safety timeout in case WebSocket hangs
      safetyTimer = setTimeout(function() {
        if (done) return;
        if (latencies.length > 0) {
          finish();
        } else {
          fallbackToHTTP();
        }
      }, 15000);
    });
  }

  // HTTP fallback for ping (used by environments where WebSocket is unavailable)
  async function testPingHTTP() {
    const g = gauges[0];
    const latencies = [];
    for (let i = 0; i < PING_COUNT; i++) {
      try {
        const t0 = performance.now();
        const resp = await fetch('/api/ping?_=' + Date.now(), { cache: 'no-store' });
        var rtt = performance.now() - t0;
        var st = resp.headers.get('Server-Timing');
        if (st) {
          var m = st.match(/dur=([\d.]+)/);
          if (m) rtt = Math.max(0, rtt - parseFloat(m[1]));
        }
        latencies.push(rtt);
        var median = computeMedian(latencies);
        var fmt = formatLatency(median);
        g.number.textContent = fmt.value;
        g.unit.textContent = fmt.unit;
        setGauge(g, (i + 1) / PING_COUNT, 'var(--accent)');
        resPing.textContent = fmt.value + ' ' + fmt.unit;
      } catch (e) { /* skip */ }
    }
    if (latencies.length === 0) {
      resPing.textContent = 'failed';
      resPing.className = 'result-value';
      return null;
    }
    var median = computeMedian(latencies);
    var fmt = formatLatency(median);
    resPing.textContent = fmt.value + ' ' + fmt.unit;
    resPing.className = 'result-value';
    return median;
  }

  async function testDownload(durationMs) {
    const g = gauges[1];
    showGauge(g);
    statusEl.innerHTML = '<span class="spinner"></span> Testing download\u2026';
    resDown.className = 'result-value active';
    resDown.innerHTML = '<span class="spinner"></span>';

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), durationMs);
      let totalReceived = 0;
      let steadyReceived = 0;   // bytes received after warmup
      let steadyStart = 0;      // timestamp when warmup ended
      let lastResultUpdate = 0; // throttle result panel text updates
      const t0 = performance.now();

      async function downloadStream(idx) {
        try {
          while (!controller.signal.aborted) {
            const resp = await fetch(
              '/api/download?size=' + STREAM_CHUNK + '&s=' + idx + '&_=' + Date.now(),
              { cache: 'no-store', signal: controller.signal }
            );
            const reader = resp.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              totalReceived += value.byteLength;
              const now = performance.now();
              const elapsedMs = now - t0;

              // Track steady-state bytes (after warmup)
              if (elapsedMs >= WARMUP_MS) {
                if (!steadyStart) steadyStart = now;
                steadyReceived += value.byteLength;
              }

              // Display uses steady-state speed if available, otherwise total
              var elapsed, bytes;
              if (steadyStart) {
                elapsed = (now - steadyStart) / 1000;
                bytes = steadyReceived;
              } else {
                elapsed = elapsedMs / 1000;
                bytes = totalReceived;
              }
              const bps = (bytes * 8) / Math.max(elapsed, 0.001);
              const fmt = formatSpeed(bps);
              g.number.textContent = fmt.value;
              g.unit.textContent = fmt.unit;
              setGauge(g, Math.min(elapsedMs / durationMs, 1), 'var(--green)');
              if (now - lastResultUpdate >= RESULT_UPDATE_MS) {
                resDown.textContent = fmt.value + ' ' + fmt.unit;
                lastResultUpdate = now;
              }
            }
          }
        } catch (e) {
          // AbortError expected when timer fires
        }
      }

      const streams = [];
      for (let i = 0; i < PARALLEL_STREAMS; i++) streams.push(downloadStream(i));
      await Promise.all(streams);
      clearTimeout(timer);

      // Final result: use steady-state measurement if we got past warmup
      var finalElapsed, finalBytes;
      if (steadyStart) {
        finalElapsed = (performance.now() - steadyStart) / 1000;
        finalBytes = steadyReceived;
      } else {
        finalElapsed = (performance.now() - t0) / 1000;
        finalBytes = totalReceived;
      }
      const bps = (finalBytes * 8) / Math.max(finalElapsed, 0.001);
      const fmt = formatSpeed(bps);
      setGauge(g, 1, 'var(--green)');
      resDown.textContent = fmt.value + ' ' + fmt.unit;
      resDown.className = 'result-value';
      return bps;
    } catch (e) {
      resDown.textContent = 'failed';
      resDown.className = 'result-value';
      return null;
    }
  }

  async function testUpload(durationMs) {
    const g = gauges[2];
    showGauge(g);
    statusEl.innerHTML = '<span class="spinner"></span> Testing upload\u2026';
    resUp.className = 'result-value active';
    resUp.innerHTML = '<span class="spinner"></span>';

    try {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), durationMs);
      let completedBytes = 0;
      let steadyBytes = 0;
      let steadyStart = 0;
      let lastResultUpdate = 0; // throttle result panel text updates
      const t0 = performance.now();

      // Smoothly advance the gauge arc based on elapsed time, independent of request completions
      const gaugeTimer = setInterval(function() {
        const frac = Math.min((performance.now() - t0) / durationMs, 1);
        setGauge(g, frac, 'var(--yellow)');
      }, 50);

      // Random fill defeats middlebox compression; crypto.getRandomValues caps at 64 KB per call.
      const payload = new Uint8Array(UPLOAD_CHUNK);
      for (let offset = 0; offset < UPLOAD_CHUNK; offset += 65536) {
        const slice = new Uint8Array(payload.buffer, offset, Math.min(65536, UPLOAD_CHUNK - offset));
        crypto.getRandomValues(slice);
      }

      async function uploadStream() {
        var errored = false;
        while (!controller.signal.aborted && !errored) {
          await new Promise(function(resolve) {
            const xhr = new XMLHttpRequest();
            var lastLoaded = 0;

            xhr.upload.onprogress = function(e) {
              const delta = e.loaded - lastLoaded;
              lastLoaded = e.loaded;
              if (delta <= 0) return;

              const now = performance.now();
              const elapsedMs = now - t0;
              completedBytes += delta;

              // Track steady-state bytes (after warmup)
              if (elapsedMs >= WARMUP_MS) {
                if (!steadyStart) steadyStart = now;
                steadyBytes += delta;
              }

              // Display uses steady-state speed if available
              var elapsed, bytes;
              if (steadyStart) {
                elapsed = (now - steadyStart) / 1000;
                bytes = steadyBytes;
              } else {
                elapsed = elapsedMs / 1000;
                bytes = completedBytes;
              }
              const bps = (bytes * 8) / Math.max(elapsed, 0.001);
              const fmt = formatSpeed(bps);
              g.number.textContent = fmt.value;
              g.unit.textContent = fmt.unit;
              if (now - lastResultUpdate >= RESULT_UPDATE_MS) {
                resUp.textContent = fmt.value + ' ' + fmt.unit;
                lastResultUpdate = now;
              }
            };

            function cleanup() {
              controller.signal.removeEventListener('abort', onAbort);
              resolve();
            }
            xhr.onload = cleanup;
            xhr.onerror = function() { errored = true; cleanup(); };
            xhr.onabort = cleanup;

            function onAbort() { xhr.abort(); }
            controller.signal.addEventListener('abort', onAbort);

            xhr.open('POST', '/api/upload');
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.send(payload);
          });
        }
      }

      const streams = [];
      for (let i = 0; i < PARALLEL_STREAMS; i++) streams.push(uploadStream());
      await Promise.all(streams);
      clearInterval(gaugeTimer);

      // Final result: use steady-state measurement if we got past warmup
      var finalElapsed, finalBytes;
      if (steadyStart) {
        finalElapsed = (performance.now() - steadyStart) / 1000;
        finalBytes = steadyBytes;
      } else {
        finalElapsed = (performance.now() - t0) / 1000;
        finalBytes = completedBytes;
      }
      const bps = (finalBytes * 8) / Math.max(finalElapsed, 0.001);
      const fmt = formatSpeed(bps);
      g.number.textContent = fmt.value;
      g.unit.textContent = fmt.unit;
      setGauge(g, 1, 'var(--yellow)');
      resUp.textContent = fmt.value + ' ' + fmt.unit;
      resUp.className = 'result-value';
      return bps;
    } catch (e) {
      resUp.textContent = 'failed';
      resUp.className = 'result-value';
      return null;
    }
  }

  window.startTest = async function() {
    btnStart.disabled = true;
    btnStart.textContent = 'Testing\u2026';

    // Reset
    resPing.textContent = '\u2014';
    resPing.className = 'result-value pending';
    resDown.textContent = '\u2014';
    resDown.className = 'result-value pending';
    resUp.textContent = '\u2014';
    resUp.className = 'result-value pending';
    resetAllGauges();
    btnCopyText.classList.remove('visible');
    btnCopyImg.classList.remove('visible');
    lastResults = null;

    // Fetch test duration from server (falls back to default if unavailable)
    let durationMs = TEST_DURATION;
    try {
      const info = await fetch('/api/info', { cache: 'no-store' }).then(r => r.json());
      if (info.test_duration) durationMs = info.test_duration * 1000;
    } catch (e) { /* use default */ }

    const pingMs = await testPing();
    const downBps = await testDownload(durationMs);
    const upBps = await testUpload(durationMs);

    lastResults = {
      pingMs:  pingMs,
      downBps: downBps,
      upBps:   upBps,
      when:    new Date()
    };
    btnCopyText.classList.add('visible');
    btnCopyImg.classList.add('visible');

    statusEl.textContent = 'Test complete';
    btnStart.disabled = false;
    btnStart.textContent = 'Test Again';
  };

  // -------------------------------------------------------------------------
  // Copy helpers

  function resultLine(label, raw, formatter, failedText) {
    if (raw == null) return label + ': ' + (failedText || 'failed');
    const f = formatter(raw);
    return label + ': ' + f.value + ' ' + f.unit;
  }

  function buildResultsText() {
    if (!lastResults) return '';
    const title = (document.querySelector('header h1').textContent || 'Speed Test').trim();
    const version = (document.querySelector('header .version').textContent || '').trim();
    const ts = lastResults.when.toLocaleString();

    const lines = [];
    lines.push('Speed Test Results — ' + title);
    if (version) lines.push(version);
    lines.push(ts);
    lines.push('');
    lines.push(resultLine('Ping    ', lastResults.pingMs,  formatLatency));
    lines.push(resultLine('Download', lastResults.downBps, formatSpeed));
    lines.push(resultLine('Upload  ', lastResults.upBps,   formatSpeed));
    lines.push(''); // trailing LF
    return lines.join('\n');
  }

  function flashCopied(btn, label) {
    const original = btn.textContent;
    btn.textContent = label || 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  }

  window.copyResultsText = async function() {
    if (!lastResults) return;
    const text = buildResultsText();
    try {
      await navigator.clipboard.writeText(text);
      flashCopied(btnCopyText);
    } catch (e) {
      // Fallback: use a temporary textarea
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        flashCopied(btnCopyText);
      } catch (e2) {
        btnCopyText.textContent = 'Copy failed';
        setTimeout(function() { btnCopyText.textContent = 'Copy as Text'; }, 1500);
      }
    }
  };

  // Rounded rectangle path helper for canvas drawing
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function formatResultString(raw, formatter) {
    if (raw == null) return 'failed';
    const f = formatter(raw);
    return f.value + ' ' + f.unit;
  }

  function renderResultsCanvas() {
    const W = 640;
    const H = 420;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const canvas = document.createElement('canvas');
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // Background
    ctx.fillStyle = '#0f1117';
    ctx.fillRect(0, 0, W, H);

    // Inner card
    const pad = 24;
    ctx.fillStyle = '#1a1d27';
    roundRectPath(ctx, pad, pad, W - pad * 2, H - pad * 2, 14);
    ctx.fill();
    ctx.strokeStyle = '#2a2e3d';
    ctx.lineWidth = 1;
    ctx.stroke();

    const title = (document.querySelector('header h1').textContent || 'Speed Test').trim();
    const version = (document.querySelector('header .version').textContent || '').trim();
    const ts = lastResults.when.toLocaleString();
    const fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';

    // Title
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#e4e6ef';
    ctx.font = '600 24px ' + fontFamily;
    ctx.fillText(title, W / 2, 78);

    // Subtitle
    ctx.fillStyle = '#6b7394';
    ctx.font = '13px ' + fontFamily;
    ctx.fillText('Measure your network performance', W / 2, 100);
    if (version) {
      ctx.font = '12px ' + fontFamily;
      ctx.fillText(version, W / 2, 120);
    }

    // Result rows
    const rows = [
      { label: 'Ping',     text: formatResultString(lastResults.pingMs,  formatLatency), colour: '#6c8cff', glyph: '\u2194' },
      { label: 'Download', text: formatResultString(lastResults.downBps, formatSpeed),   colour: '#4ade80', glyph: '\u2193' },
      { label: 'Upload',   text: formatResultString(lastResults.upBps,   formatSpeed),   colour: '#fbbf24', glyph: '\u2191' }
    ];

    const rowH = 64;
    const rowX = pad + 28;
    const rowW = W - (pad + 28) * 2;
    let rowY = 160;

    rows.forEach(function(r) {
      // Row background
      ctx.fillStyle = '#0f1117';
      roundRectPath(ctx, rowX, rowY, rowW, rowH, 10);
      ctx.fill();

      // Icon square
      const iconSize = 40;
      const iconX = rowX + 14;
      const iconY = rowY + (rowH - iconSize) / 2;
      ctx.fillStyle = r.colour + '22'; // ~13% alpha via hex suffix
      roundRectPath(ctx, iconX, iconY, iconSize, iconSize, 8);
      ctx.fill();
      ctx.fillStyle = r.colour;
      ctx.font = '600 20px ' + fontFamily;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(r.glyph, iconX + iconSize / 2, iconY + iconSize / 2 + 1);

      // Label
      ctx.fillStyle = '#6b7394';
      ctx.font = '14px ' + fontFamily;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(r.label, iconX + iconSize + 16, rowY + rowH / 2);

      // Value
      ctx.fillStyle = r.text === 'failed' ? '#f87171' : '#e4e6ef';
      ctx.font = '600 20px ' + fontFamily;
      ctx.textAlign = 'right';
      ctx.fillText(r.text, rowX + rowW - 16, rowY + rowH / 2);

      rowY += rowH + 10;
    });

    // Timestamp footer
    ctx.fillStyle = '#6b7394';
    ctx.font = '11px ' + fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(ts, W / 2, H - pad - 14);

    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise(function(resolve, reject) {
      canvas.toBlob(function(b) {
        if (b) resolve(b);
        else reject(new Error('toBlob returned null'));
      }, 'image/png');
    });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  window.copyResultsImage = async function() {
    if (!lastResults) return;

    // Render synchronously inside the click handler so the user-gesture chain
    // is preserved for ClipboardItem.
    let canvas;
    try {
      canvas = renderResultsCanvas();
    } catch (e) {
      console.error('render failed', e);
      btnCopyImg.textContent = 'Copy failed';
      setTimeout(function() { btnCopyImg.textContent = 'Copy as Image'; }, 1500);
      return;
    }

    // Prefer the async clipboard API with a Promise<Blob>. Safari requires this
    // exact shape: ClipboardItem must be constructed synchronously from the
    // click, and the blob Promise is awaited by the browser itself.
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        const blobPromise = canvasToBlob(canvas);
        const item = new ClipboardItem({ 'image/png': blobPromise });
        await navigator.clipboard.write([item]);
        flashCopied(btnCopyImg);
        return;
      } catch (e) {
        console.warn('clipboard.write failed, falling back to download', e);
        // Fall through to the download fallback.
      }
    }

    // Fallback: offer the image as a download.
    try {
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, 'speedtest-results.png');
      flashCopied(btnCopyImg, 'Downloaded');
    } catch (e) {
      console.error('download fallback failed', e);
      btnCopyImg.textContent = 'Copy failed';
      setTimeout(function() { btnCopyImg.textContent = 'Copy as Image'; }, 1500);
    }
  };
})();
</script>
</body>
</html>
